bot:
  automerge: true

conda_build_tool: rattler-build

conda_build:
  error_overlinking: true

conda_forge_output_validation: true

github:
  branch_name: main
  tooling_branch_name: main

# Both ARM targets build on native runners: linux_aarch64 on GitHub Actions'
# ubuntu-24.04-arm, osx_arm64 on Azure's macOS-15-arm64. No emulation, no
# cross-compilation, so every package is also tested where it is built.
provider:
  linux_aarch64: native
  osx_arm64: native
