{% set name = "gopass" %}
{% set version = "1.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/gopasspw/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ce004c82b65ffac44de2991020843828b38bb510909506f2fa0f40bec05b7c75

build:
  number: 0
  script:
    # `|| exit 1` is required on every line but the last: cmd.exe otherwise only
    # reports the last command's exit code and a failing build looks green.
    - make build || exit 1
    # go-licenses misreads filippo.io/nistec/internal/fiat's README as a
    # BSD-1-Clause license file, a type it does not know about. The module's real
    # LICENSE is still saved, via filippo.io/nistec itself.
    - go-licenses save . --save_path license-files --ignore filippo.io/nistec/internal/fiat || exit 1
    - make install  # [unix]
    # Copy the executable under Windows (`make install` does not work)
    - COPY gopass "%LIBRARY_BIN%\gopass.exe"  # [win]
    # Clear out cache to avoid file not removable warnings
    - chmod -R u+w $(go env GOPATH) && rm -r $(go env GOPATH)  # [unix]

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses
    - make

test:
  commands:
    - gopass --help

about:
  home: https://www.gopass.pw
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: The slightly more awesome standard unix password manager for teams.
  dev_url: https://github.com/gopasspw/gopass

extra:
  recipe-maintainers:
    - anjos
